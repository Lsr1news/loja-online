nome: CI / testes

on:
  branches: ["main"]
pull_request:
  branches: ["main"]

jobs:
  test:
    runs-on: ubunto-latest

    steps:
      - uses: actions/checkout@v4

      - name: configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: instalar dependências
        run: npm install

        - name: Rodar testes
          run: node carrinho.test.js